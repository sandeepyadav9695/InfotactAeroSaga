
services:
  temporal:
    image: temporalio/temporal:latest
    ports:
      - "7233:7233"
    command: server start-dev --ip 0.0.0.0

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
    ports:
      - "8088:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
