spring.application.name=AerosagaProject

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/AeroSaga?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:Sand@123}

# Server
server.port=8081


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info

# Temporal
temporal.target=localhost:7233
aerosaga.temporal.target=${temporal.target}
aerosaga.temporal.task-queue=AEROSAGA_DRONE_TASK_QUEUE

# Drone battery thresholds
aerosaga.drone.return-home-battery-percent=25
aerosaga.drone.emergency-battery-percent=10

# Drone endurance
aerosaga.endurance-minutes=45

# Monitoring
aerosaga.monitoring.interval-ms=10000

# Simulation: 1 simulated minute per real second
aerosaga.simulation-time-scale=60
